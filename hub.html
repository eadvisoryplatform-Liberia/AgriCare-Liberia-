<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agro Care Liberia</title>
<meta name="theme-color" content="#0f3d2a">
<link rel="icon" href="../assets/logo.jpg">
<style>
:root{--bg:#f1f6ef;--card:#fff;--ink:#14291e;--muted:#5d7064;--line:#dbe6d8;--forest:#0f3d2a;--leaf:#1f9156;--mint:#d9f0df;--gold:#f0b232;--goldsoft:#fff1cc;--goldtxt:#7a5200;--blue:#1d4f9f;--bluesoft:#dbe8fb;--red:#c23b32;--redsoft:#fde3e0;--shadow:0 6px 18px rgba(15,61,42,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a13;--card:#15261c;--ink:#e8f2e8;--muted:#9bb2a2;--line:#28402f;--forest:#0a2a1d;--leaf:#3fc97f;--mint:#1c3a28;--goldsoft:#3a3114;--goldtxt:#f0c768;--blue:#8fb4f2;--bluesoft:#1b2e4d;--red:#f0968e;--redsoft:#3b1d1b;--shadow:none}}
:root[data-theme="dark"]{--bg:#0c1a13;--card:#15261c;--ink:#e8f2e8;--muted:#9bb2a2;--line:#28402f;--forest:#0a2a1d;--leaf:#3fc97f;--mint:#1c3a28;--goldsoft:#3a3114;--goldtxt:#f0c768;--blue:#8fb4f2;--bluesoft:#1b2e4d;--red:#f0968e;--redsoft:#3b1d1b;--shadow:none}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--forest)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;padding-bottom:96px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--forest);z-index:60}
h1,h2,h3{margin:0;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1rem;font-weight:700;margin:14px 0 6px}
main{max-width:760px;margin:0 auto;padding:14px 16px}
.top{background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-size:1.1rem}
.logo{width:38px;height:38px;border-radius:12px;background:var(--gold);color:var(--forest);display:grid;place-items:center}
.lp{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 10px}
.lp select{background:transparent;color:#fff;border:0;font:inherit;font-weight:600;max-width:34vw}
.lp select option{color:#14291e}
.hero{position:relative;background:linear-gradient(170deg,#0f3d2a,#1f7a4d 70%,#3fae6a);color:#fff;overflow:hidden;border-radius:0 0 28px 28px;min-height:210px}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero-t{position:relative;padding:22px 20px 70px;max-width:760px;margin:0 auto}
.hero h1{font-size:1.9rem;font-weight:800;line-height:1.1}
.hero p{margin:8px 0 0;max-width:30ch;opacity:.95}
.drift{animation:drift 30s linear infinite alternate}
@keyframes drift{to{transform:translateX(40px)}}
@media (prefers-reduced-motion:reduce){.drift{animation:none}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tile{display:flex;align-items:center;gap:12px;background:var(--card);border:0;border-radius:18px;padding:16px 12px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);font:inherit;cursor:pointer;min-height:76px}
.tile.wide{grid-column:1/-1;background:var(--forest);color:#fff}
.tic{width:48px;height:48px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.tile b{font-size:1rem}
.snap,.alert{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:0;border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);margin-top:-48px;position:relative;cursor:pointer}
.snap b{font-size:1.6rem;display:block;line-height:1.1}
.alert{margin-top:12px;border-left:6px solid var(--gold)}
.alert.high{border-left-color:var(--red)}
.alert small{display:block;color:var(--muted)}
.ai{width:40px;height:40px;border-radius:12px;background:var(--redsoft);color:var(--red);display:grid;place-items:center;flex:none}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.phi{width:42px;height:42px;border-radius:13px;background:var(--forest);color:var(--gold);display:grid;place-items:center}
.card,.panel{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.muted{color:var(--muted);font-size:.88rem}
.note{background:var(--goldsoft);border-radius:14px;padding:11px 13px;font-size:.92rem;margin:10px 0}
select,input[type=text],input[type=tel],input[type=url],input[type=password],textarea{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
label{display:block;font-size:.85rem;font-weight:700;margin:12px 0 4px}
.lp,.lp select{width:auto}
.btn{font:700 .92rem system-ui,sans-serif;border:2px solid var(--leaf);background:transparent;color:var(--leaf);border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.solid{background:var(--leaf);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3b2a00}
.btn.small{padding:7px 14px;min-height:38px;font-size:.84rem}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}
.chip{flex:none;border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;min-height:42px;box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{background:var(--forest);color:#fff}
.tag{display:inline-block;font-size:.76rem;font-weight:700;border-radius:999px;padding:2px 10px;margin-right:6px;background:var(--mint);color:var(--leaf)}
.tag.buyer{background:var(--bluesoft);color:var(--blue)}
.tag.supplier,.tag.demo,.tag.medium{background:var(--goldsoft);color:var(--goldtxt)}
.tag.high{background:var(--red);color:#fff}
.ct{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;background:hsl(var(--h) 75% 88%);flex:none}
.lc{background:var(--card);border-radius:20px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
.lc-i{height:130px;display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h) 70% 86%),hsl(var(--h) 60% 74%));font-size:3.4rem}
.lc-i img{width:100%;height:100%;object-fit:cover}
.lc-b{padding:12px 14px 14px}
.price{font-size:1.25rem;font-weight:800;color:var(--leaf)}
.pin{color:var(--muted);font-size:.88rem}
.addb{list-style:none;cursor:pointer;background:var(--gold);color:#3b2a00;font-weight:800;border-radius:999px;padding:12px 18px;text-align:center;margin:6px 0 12px;min-height:46px}
.addb::-webkit-details-marker{display:none}
details.add>div{background:var(--card);border-radius:18px;padding:4px 14px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
details.q{background:var(--card);border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow)}
details.q>summary{cursor:pointer;padding:13px 14px;font-weight:700}
details.q>div{padding:0 14px 12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.ctile,.opt{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid transparent;border-radius:18px;padding:12px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;box-shadow:var(--shadow);min-height:70px}
.ctile.on,.opt.on{border-color:var(--leaf)}
.ctile{flex-direction:column;justify-content:center;text-align:center;font-weight:700}
.opt{width:100%;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:4px 0 10px}

.cal i.r{background:var(--bluesoft);color:var(--blue)}
.cal i.p{background:var(--leaf);color:#fff;font-weight:700}
.wxhero{display:flex;align-items:center;gap:16px;border-radius:24px;padding:18px;color:#fff;background:linear-gradient(150deg,#2a8fd1,#6cc3ee)}
.wxhero.wx-rain,.wxhero.wx-fog{background:linear-gradient(150deg,#4b6b86,#8aa4b8)}
.wxhero.wx-storm{background:linear-gradient(150deg,#2f3b52,#667792)}
.wxhero.wx-clear{background:linear-gradient(150deg,#f08a24,#f6c453)}
.big{font-size:3.2rem;font-weight:800;line-height:1}
.fcs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.fc{flex:none;width:68px;background:var(--card);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;box-shadow:var(--shadow)}
.fc i{width:10px;background:#3b82c4;border-radius:4px;min-height:2px;margin-top:4px}
.fc small{color:var(--muted)}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--forest);border-radius:26px;display:flex;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:40}
nav button{flex:1;border:0;background:none;color:#b9d3c3;font:inherit;font-size:.68rem;padding:6px 2px;cursor:pointer;min-height:52px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button[aria-current="page"]{background:var(--gold);color:#3b2a00;font-weight:800}
.mhead{background:linear-gradient(160deg,#0f3d2a,#1f7a4d);color:#fff;padding:18px 16px 26px;border-radius:0 0 26px 26px}
.mhead h1{font-size:1.6rem;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:-14px 0 14px}
.m{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;font-size:.85rem}
.m b{display:block;font-size:1.7rem;line-height:1.1}
.m .tic{width:40px;height:40px;border-radius:12px}
.bars div.r{display:grid;grid-template-columns:100px 1fr 30px;gap:8px;align-items:center;font-size:.85rem;margin:6px 0}
.bars i{display:block;height:14px;background:linear-gradient(90deg,var(--leaf),#7fd39d);border-radius:8px}
.spark{width:100%;height:auto}
.donutw{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{width:120px;height:120px;border-radius:50%;position:relative}
.donut::after{content:"";position:absolute;inset:26px;background:var(--card);border-radius:50%}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tr{display:flex;gap:8px;align-items:center}
.acc{width:40px;height:40px;border-radius:50%;border:0;background:var(--gold);color:#3b2a00;font:800 1rem system-ui;display:grid;place-items:center;cursor:pointer;flex:none}
.link{background:none;border:0;color:var(--leaf);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px 0}
.phrow{display:flex;gap:8px;align-items:center}.phrow span{font-weight:800;background:var(--mint);color:var(--leaf);border-radius:12px;padding:11px 12px}
.scanhero{display:flex;align-items:center;gap:14px;width:100%;margin-top:14px;padding:16px;border:0;border-radius:20px;background:linear-gradient(135deg,var(--forest),#1f7a4d);color:#fff;font:inherit;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.scanhero b{display:block;font-size:1.15rem}.scanhero small{opacity:.9}
nav button.sc{margin-top:-20px;background:var(--gold);color:#3b2a00;border-radius:22px;font-weight:800;min-height:64px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
nav button.sc[aria-current="page"]{background:#fff}
.cam{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:58vh;margin:8px 0}
.cam video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;inset:12%;border:3px dashed rgba(255,255,255,.75);border-radius:18px;pointer-events:none}
.shots{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.shot{position:relative;width:86px;height:86px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.shot img{width:100%;height:100%;object-fit:cover}
.shot button{position:absolute;top:3px;right:3px;width:26px;height:26px;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.hbadge{display:inline-block;padding:4px 14px;border-radius:999px;color:#fff;font-weight:800}
.meter{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}.meter i{display:block;height:100%;background:var(--leaf)}
.scanning{text-align:center;font-weight:700}
@media (prefers-reduced-motion:no-preference){.scanning{animation:pulse 1.3s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}}
</style>

}

  else if(a==="exp"){dl("translations.json",JSON.stringify(T,null,2),"application/json")}
  else if(a==="imp"){$("impf").click()}
});
document.addEventListener("input",function(e){if(e.target.id==="msearch")$("mlist").innerHTML=mList()});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="lsel"){lang=el.value;sv("fh-lang",lang);track("lang",{});render()}

  else if(el.id==="srv"){srv=el.value.trim().replace(/\/+$/,"");sv("fh-srv",srv);boot()}
  else if(el.getAttribute&&el.getAttribute("data-k")){if(!T[lang])T[lang]={};T[lang][el.getAttribute("data-k")]=el.value.trim();sv("fh-tr",T)}
  else if(el.id==="impf"){var f=el.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var d=JSON.parse(rd.result);Object.keys(d).forEach(function(l){if(LANGS.indexOf(l)>0){T[l]=Object.assign(T[l]||{},d[l])}});sv("fh-tr",T);render()}catch(x){}};rd.readAsText(f)}
});
